plugins {
    id 'java-library'
    id 'scala'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.modrinth.minotaur' version '2.8.7'
}

// ---------------------------------------------------------------------------
// Versioning
// ---------------------------------------------------------------------------

def gitRef = providers.exec {
    commandLine 'git', 'rev-parse', '--short', 'HEAD'
    ignoreExitValue = true
}.standardOutput.asText.map { it.trim() ?: 'unknown' }.getOrElse('unknown')

def fullModVersion = mod_version
if (fullModVersion.endsWith('-snapshot')) {
    fullModVersion += '-' + new Date().format('yyyyMMdd')
}

group = mod_group_id
version = "MC${minecraft_version}-${fullModVersion}+${gitRef}"

base {
    archivesName = mod_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

// ---------------------------------------------------------------------------
// Sources
//
// The 1.12.2 sources are ported to 1.21.1 in place (see docs/PORTING-MC1.21.1.md).
// Until a file has been ported it stays in the tree but is left out of
// compilation. Add paths/patterns here as subsystems are ported; once the
// whole tree compiles this list goes away.
// ---------------------------------------------------------------------------

def portedSources = [
        'li/cil/oc/OpenComputersMod.java',
        'li/cil/oc/ModBootstrap.scala',
        'li/cil/oc/common/gametest/**',
        'li/cil/oc/api/**',
]

sourceSets {
    main {
        // Java and Scala reference each other (the Java @Mod entry point calls
        // into Scala), so compile both jointly through scalac.
        java { srcDirs = [] }
        scala {
            srcDirs = ['src/main/scala', 'src/main/java']
            include portedSources
        }
        resources { srcDir 'src/generated/resources' }
    }
    test {
        // Re-enabled once the code under test has been ported.
        java { exclude '**' }
        scala { exclude '**' }
    }
}

// ---------------------------------------------------------------------------
// NeoForge
// ---------------------------------------------------------------------------

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// ---------------------------------------------------------------------------
// Dependencies
// ---------------------------------------------------------------------------

repositories {
    maven {
        name = 'MightyPirates'
        url = 'https://maven.cil.li/'
        metadataSources {
            mavenPom()
            artifact()
        }
    }
    ivy {
        name = 'asie dependency mirror'
        artifactPattern 'https://asie.pl/javadeps/[module]-[revision](-[classifier]).[ext]'
        metadataSources {
            artifact()
        }
    }
}

configurations {
    // Libraries whose classes are copied directly into the mod jar. They are
    // already relocated under li.cil.repack, so they can't clash with other
    // mods' copies.
    embedded
    implementation.extendsFrom embedded

    // In dev runs, plain (non-mod) libraries are only visible to the game if
    // they're on this classpath. In production they come from jar-in-jar or
    // are merged into the mod jar instead.
    additionalRuntimeClasspath.extendsFrom embedded
}

dependencies {
    // NeoForge does not ship a Scala runtime, so bundle it via jar-in-jar.
    jarJar(implementation('org.scala-lang:scala-library')) {
        version {
            strictly project.scala_version_range
            prefer project.scala_version
        }
    }
    // Used by Settings for application.conf (Forge 1.12 used to provide it).
    jarJar(implementation('com.typesafe:config')) {
        version {
            strictly project.typesafe_config_version_range
            prefer project.typesafe_config_version
        }
    }
    additionalRuntimeClasspath "org.scala-lang:scala-library:${scala_version}"
    additionalRuntimeClasspath "com.typesafe:config:${typesafe_config_version}"

    embedded name: 'OC-LuaJ', version: '20220907.1', ext: 'jar'
    embedded name: 'OC-JNLua', version: '20230530.0', ext: 'jar'
    embedded name: 'OC-JNLua-Natives', version: '20220928.1', ext: 'jar'
}

// ---------------------------------------------------------------------------
// Compilation
// ---------------------------------------------------------------------------

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(ScalaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xmaxerrs', '10000']
    scalaCompileOptions.additionalParameters = [
            '-release', '21', '-deprecation', '-feature',
            // The 1.12 code base uses procedure syntax (`def f() {`) about a
            // thousand times. It's still valid in Scala 2.13, so don't drown
            // real warnings in it.
            '-Wconf:cat=deprecation&msg=procedure syntax:s',
    ]
    configure(scalaCompileOptions.forkOptions) {
        memoryMaximumSize = '2g'
    }
}

// ---------------------------------------------------------------------------
// Resources
// ---------------------------------------------------------------------------

def metadataProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : fullModVersion,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
]

processResources {
    inputs.properties metadataProperties
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('META-INF/neoforge.mods.toml') {
        expand metadataProperties
    }
    filesMatching('application.conf') {
        filter { line -> line.replace('@VERSION@', fullModVersion) }
    }
}

// ---------------------------------------------------------------------------
// Packaging
// ---------------------------------------------------------------------------

jar {
    from(provider { configurations.embedded.collect { zipTree(it) } }) {
        exclude 'META-INF', 'META-INF/**'
    }
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': fullModVersion,
                'Implementation-Vendor' : mod_authors,
        ])
    }
}

javadoc {
    include 'li/cil/oc/api/**'
}

tasks.register('apiJar', Jar) {
    archiveClassifier = 'api'
    from sourceSets.main.allSource
    from sourceSets.main.output
    include 'li/cil/oc/api/**'
}

tasks.register('javadocJar', Jar) {
    dependsOn javadoc
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

// ---------------------------------------------------------------------------
// Publishing
// ---------------------------------------------------------------------------

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group
            artifactId = mod_name
            version = fullModVersion
            artifact jar
            artifact tasks.named('apiJar')
            artifact tasks.named('javadocJar')
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = System.getenv('GITHUB_MAVEN_URL') ?: ''
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}

modrinth {
    token = System.getenv('MODRINTH_API_KEY') ?: ''
    projectId = modrinth_project_id
    changelog = System.getenv('CHANGELOG') ?: 'Changelog not available.'
    versionNumber = fullModVersion
    versionName = "${mod_name}-${version}"
    versionType = System.getenv('MODRINTH_RELEASE_TYPE') ?: 'alpha'
    uploadFile = jar
    gameVersions = [minecraft_version]
    loaders = ['neoforge']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
